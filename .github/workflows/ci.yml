name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  java:
    name: Spring Boot (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build (skip tests)
        run: ./mvnw -q -B -DskipTests package
      - name: Test
        run: ./mvnw -q -B test

  node:
    name: Renderer + spec (build & render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Build (typecheck all workspaces)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test workspaces (SceneSpec contract)
        run: npm test
      - name: Ensure Remotion headless browser
        run: npx --workspace @toucan/renderer remotion browser ensure
      - name: Render throwaway composition (gate)
        run: npm run render --workspace @toucan/renderer
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: throwaway-mp4
          path: renderer/out/throwaway.mp4
          if-no-files-found: error
