spring.application.name=toucan

#server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/toucan_motion
spring.datasource.username=toucan_motion
spring.datasource.password=toucan_motion
spring.datasource.driver-class-name=org.postgresql.Driver
# Flyway owns the schema (Section F). ddl-auto=validate so Hibernate only checks
# the entities against the Flyway-managed schema and surfaces drift — it no longer
# mutates the database.
spring.jpa.hibernate.ddl-auto=validate
# Adopt the pre-existing schema: on a non-empty DB with no flyway_schema_history,
# Flyway baselines at v1 and skips V1__baseline.sql; fresh DBs run V1 to build it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.bootstrap.admin.enabled=false
