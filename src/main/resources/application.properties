# --- Toucan generation ---
# Provider: openai | anthropic | stub | auto (auto = whichever key is set, else the stub generator).
llm.provider=openai

# OpenAI (GPT) — current provider. Set OPENAI_API_KEY (or paste the key here).
openai.api.key=${OPENAI_API_KEY:}
# The model only emits a compact JSON spec (content), not animation code — the renderer does visuals.
openai.model=gpt-4.1
# Specs are small, but keep headroom for longer code snippets / many flow nodes.
openai.max-tokens=16000
# Modest temperature: the renderer pins the look, so we just want accurate, well-chosen content.
openai.temperature=0.4
openai.base-url=https://api.openai.com/v1

# Anthropic (Claude) — kept available; switch back with llm.provider=anthropic.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-opus-4-8
anthropic.max-tokens=20000

# --- Animation engine (v0.1 product: HTML engine; SceneSpec/Remotion kept behind the flag) ---
# app.engine=html   -> the toucan-motion CLI generates a self-contained HTML animation, hosted at
#                      /preview/{id} (the v0.1 deliverable). No renderer/callback in this path.
# app.engine=scenespec -> the SceneSpec director -> Remotion MP4 path (unchanged, for later).
app.engine=html
# Keyless smoke path: use the engine's reference fixture instead of the API (no key, no spend).
app.engine.mock=false
# How the orchestrator invokes the CLI. working-dir is the CLI project so its dotenv finds
# toucan-motion/.env (the API key); the JVM's ANTHROPIC_API_KEY, if set, is inherited too.
app.engine.cli.node=node
app.engine.cli.script=dist/cli.js
app.engine.cli.working-dir=toucan-motion
app.engine.cli.provider=anthropic
# Empty -> the CLI's provider default (currently claude-sonnet-5).
app.engine.cli.model=
app.engine.cli.timeout-seconds=300

# --- Static publishing (v0.1: local filesystem served by Spring Boot under /preview/**) ---
# Swap LocalPublishingService for a Cloudflare R2 implementation later without touching callers.
app.publish.dir=published
app.publish.base-url=http://localhost:8080

# --- Orchestration spine (Section 4) ---
# Where the Node renderer service listens (Spring -> renderer POST /render).
app.renderer.base-url=http://localhost:3001
# Base URL the renderer should call back on (renderer -> Spring POST /api/internal/render-callback).
app.internal.callback-base-url=http://localhost:8080
# Shared secret for service-to-service auth on /api/internal/** (X-Internal-Token). The renderer
# holds the same value in its INTERNAL_RENDER_TOKEN env var. Override per environment.
app.internal.render-token=${INTERNAL_RENDER_TOKEN:dev-internal-render-token}
# Per-user minimum gap between generations (User.lastGeneration hook). 0 disables it for dev.
app.ratelimit.generation-cooldown-seconds=0